services:
  - type: web
    name: vera-bot
    runtime: python
    plan: starter            # use a paid/always-on plan: free instances sleep and fail healthz
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: TEAM_NAME
        value: Aditya Ahlawat
      - key: LLM_PROVIDER        # optional: anthropic | openai | gemini | groq | deepseek | openrouter
        sync: false
      - key: LLM_API_KEY
        sync: false
